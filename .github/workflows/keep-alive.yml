# A free Supabase database pauses after 7 days with no visits. This visits it twice a week.
# It does nothing until your team adds the two secrets, so teams without a database stay green.
name: Keep Supabase awake
on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Visit the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "No database secrets set. Nothing to keep awake."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/")
          echo "The database answered with HTTP $code."
          if [ "$code" = "000" ]; then
            echo "Could not reach the database. Check the SUPABASE_URL secret."
            exit 1
          fi
